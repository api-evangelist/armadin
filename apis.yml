name: Armadin
description: >-
  Armadin is an AI-native cybersecurity company building the "Ultimate Attacker" —
  an autonomous, agentic offensive security platform that continuously identifies,
  proves, and prioritizes exploitable risk across enterprise attack surfaces.
  Founded in 2025 and launched publicly in March 2026, Armadin is headquartered in
  San Francisco and was co-founded by Kevin Mandia (founder of Mandiant, former
  FireEye CEO) alongside former Mandiant and Google Cloud Security leaders. The
  company pairs agentic AI "attacker swarms" with elite human red teamers to deliver
  continuous, 24/7 red teaming and prioritized remediation, framed as a response to
  AI-driven machine-speed "Hyperattacks." Armadin raised $189.9M in combined Seed and
  Series A funding led by Accel, with Google Ventures, Kleiner Perkins, Menlo Ventures,
  8VC, Ballistic Ventures, and In-Q-Tel participating. It is currently a security
  services and platform company with no public developer API surface.
